# dsh-everything-mcp — the entire integration, in one row.
#
# The row below mounts the MCP client bridge that ships inside DeepSeek Harness
# (`@deepseek-ai/dsh-mcp-client`) and points it at the Everything search MCP
# server (npm: everything-mcp-server) over stdio. Nothing else is added: no Host
# plugin, no web route, no state file.
#
# The upstream server's tools reach the model as `mcp__everything__<tool>`.
- insert:
    - id: mcp-everything
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: everything
        transport: stdio
        # `npx` resolves from the PATH of the process that runs DSH. No absolute
        # path is written here on purpose: this file is shipped to other people's
        # machines, and a hardcoded user directory is the usual reason a plugin
        # works for its author and nowhere else.
        command: npx
        args:
          - -y
          - everything-mcp-server
        # The server answers from Everything's index; 60 s is already generous.
        # If you raise EVERYTHING_TIMEOUT_MS past it, raise this too.
        toolCallTimeoutMs: 60000
        # A server that cannot start leaves the rest of the harness working and
        # logs the reason, instead of failing this row at activation.
        failOnStartupError: false
